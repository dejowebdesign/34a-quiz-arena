# ---------------------------------------------------------------------------
# 34A Quiz Arena - Standardbereitstellung
#
# Dies ist die einzige Compose-Datei des Projekts und die Datei, die der
# Portainer-Git-Stack verwenden muss (Compose path: docker-compose.yml).
# Es gibt bewusst keine zweite Compose-Datei. Eine Datei ohne eigenen
# "image"-Eintrag, die nur als Ergaenzung gedacht war, wurde in Portainer
# faelschlich als Hauptdatei geladen und mit der Meldung abgelehnt:
#   service "quiz-arena" has neither an image nor a build context specified
# Deshalb liegt die vollstaendige Konfiguration jetzt an genau einer Stelle.
#
# Das Image kommt aus GitHub Container Registry. Es wird nichts lokal gebaut.
# Ein externes Docker-Netz ist nicht erforderlich.
#
# Schnellstart auf dem Zielserver:
#   1. Stack in Portainer anlegen, Compose-Pfad: docker-compose.yml
#   2. Umgebungsvariablen im Stack setzen (siehe unten)
#   3. Deploy the stack
#   4. Aufruf: http://<SERVER-IP>:3002
#
# Aktualisieren:
#   Portainer: Stack oeffnen -> Pull and redeploy
#
# Ports: Der Host-Port ist ueber QUIZ_PORT konfigurierbar (Standard 3002), der
# Container-Port bleibt 3000. Auf dem Umbrel-Host sind 3000 und 3001 bereits
# belegt; 3002 ist die freie Wahl.
#
# Wichtig zu .env: Compose liest Dollarzeichen als Variablenverweis. Ein
# scrypt-Hash muss deshalb mit doppelten Dollarzeichen geschrieben werden,
# sonst wird er abgeschnitten und die Anmeldung schlaegt fehl:
#   ADMIN_PASSWORD_HASH=scrypt$$16384$$8$$1$$<salt-hex>$$<hash-hex>
# Im Portainer-Formular dagegen die einfachen Dollarzeichen eintragen.
# ---------------------------------------------------------------------------
services:
  quiz-arena:
    # Fertiges Image aus GHCR. Kein build-Abschnitt, damit Portainer nur
    # herunterlaedt und startet.
    image: ghcr.io/dejowebdesign/34a-quiz-arena:latest
    # Bei jedem Start die aktuelle Fassung des Tags holen. Ein reiner Neustart
    # des Containers durch die restart-Regel loest kein erneutes Laden aus.
    pull_policy: always
    container_name: quiz-arena
    restart: unless-stopped
    # Kein env_file: die Werte kommen aus den Variablen des Portainer-Stacks
    # oder aus einer .env neben dieser Datei. Fehlt beides, gelten die
    # Vorgaben unten.
    environment:
      NODE_ENV: production
      # Container-Port. Nicht aendern; der Host-Port steht unter ports.
      PORT: "3000"
      DB_PATH: /app/data/quiz-arena.db
      # Hinter einem HTTPS-Reverse-Proxy aktiv lassen.
      TRUST_PROXY: "true"
      # ${VAR:-} uebernimmt den gesetzten Wert, sonst bleibt der Eintrag leer.
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_USER: ${ADMIN_USER:-moderator}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MODERATOR_TTL_MS: ${MODERATOR_TTL_MS:-43200000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    volumes:
      # Persistente SQLite-Datenbank und Zertifikate. Dieses Volume bleibt bei
      # Updates erhalten.
      - quiz-data:/app/data
    ports:
      # Host-Port 3002 (konfigurierbar ueber QUIZ_PORT) auf Container-Port 3000.
      # Auf dem Umbrel-Host sind 3000 und 3001 belegt.
      # Nur lokal erreichbar machen: "127.0.0.1:${QUIZ_PORT:-3002}:3000"
      - "${QUIZ_PORT:-3002}:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  # Name bleibt gegenueber frueheren Fassungen unveraendert, damit vorhandene
  # Datenbanken bei einem Update nicht verloren gehen.
  quiz-data:
    driver: local
