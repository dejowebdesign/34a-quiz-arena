# ---------------------------------------------------------------------------
# 34A Quiz Arena - Pruefung und Veroeffentlichung des Docker-Images
#
# Pull Request: Tests, Typecheck und Build. Das Image wird gebaut, aber nicht
#               veroeffentlicht.
# Push auf main: derselbe Ablauf, danach Veroeffentlichung nach GHCR.
#
# Das Paket landet unter ghcr.io/dejowebdesign/34a-quiz-arena.
# ---------------------------------------------------------------------------
name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Ein neuer Lauf auf demselben Ref bricht den vorherigen ab.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Standardmaessig nur Lesen. Die Schreibrechte stehen am Publish-Job.
permissions:
  contents: read

env:
  # Ergibt ghcr.io/dejowebdesign/34a-quiz-arena
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # --- Tests, Typecheck und Build ------------------------------------------
  verify:
    name: Tests, Typecheck und Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # --- Image bauen und nach GHCR veroeffentlichen --------------------------
  publish:
    name: Image bauen und veroeffentlichen
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # Sichert die exakte Namensgebung ab. Bricht ab, falls IMAGE_NAME
      # unerwartet vom vorgesehenen Paketnamen abweicht.
      - name: Image-Namen pruefen
        run: |
          expected="ghcr.io/dejowebdesign/34a-quiz-arena"
          actual="${{ env.IMAGE_NAME }}"
          if [ "$actual" != "$expected" ]; then
            echo "FEHLER: Image-Name ist '$actual', erwartet wird '$expected'." >&2
            exit 1
          fi
          echo "Image-Name bestaetigt: $actual"

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      # Nur beim Push auf main anmelden. Bei Pull Requests wird nicht
      # veroeffentlicht, daher ist keine Anmeldung noetig.
      - name: Bei GHCR anmelden
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels ermitteln
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Zeigt das tatsaechlich verwendete Image und die Tags. Keine Geheimnisse.
      - name: Verwendete Tags anzeigen
        run: |
          echo "Image: ${{ env.IMAGE_NAME }}"
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Image bauen und veroeffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Bei Pull Requests nur bauen, nicht veroeffentlichen.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
